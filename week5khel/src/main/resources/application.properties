# Database Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/khel_app?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# JPA/Hibernate Configuration (optional - we're using JDBC)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# JWT Configuration
jwt.secret=khelAppSecretKeyForJWTTokenGenerationAndValidation2024SpringMvcApplication
jwt.expiration=86400000
# JWT token expiration time in milliseconds (24 hours = 86400000 ms)
jwt.refresh.expiration=604800000
# Refresh token expiration time in milliseconds (7 days = 604800000 ms)

# Application Configuration
app.name=Khel Sports App
app.version=1.0.0
app.description=Sports Venue Booking Platform with JWT Authentication

# Server Configuration (if using embedded server)
server.port=8080
server.servlet.context-path=/KhelApp

# Logging Configuration
logging.level.com.example=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.io.jsonwebtoken=DEBUG

# JSON Configuration
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Validation Configuration
spring.validation.enabled=true

# Session Configuration (for traditional web endpoints)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false